title: RAG 引擎从零到一
description: 一份循序渐进的 RAG 学习路线，从关键词匹配到工程化引擎
url: ""
baseurl: "/mist-rag"

# Markdown 渲染
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  toc_levels: 1..3
  hard_wrap: false

# 排除非站点内容
exclude:
  - lessons/             # Python 课程代码（不渲染）
  - "*.py"
  - requirements.txt
  - .gitignore
  - .git/
  - README.md            # 用 index.md 作为首页
  - vendor/
  - Gemfile
  - Gemfile.lock
  - node_modules/

# 把根目录的几个 md 也纳入站点
include:
  - RAG_LEARNING_OUTLINE.md

# 集合：把每节课视为有顺序的章节
collections:
  lessons:
    output: true
    permalink: /:collection/:name/

# 默认 front-matter：所有 md 都自动套用 default 布局
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "docs/lessons"
    values:
      layout: default
      section: "课程章节"
  - scope:
      path: ""
      type: "lessons"
    values:
      layout: default
      section: "课程章节"

# 主题留空 —— 我们自定义 layout
theme: null
plugins: []

# 站点导航数据（侧边栏使用）
navigation:
  - title: "📚 教程导航"
    items:
      - title: "首页"
        url: "/"
      - title: "学习大纲"
        url: "/RAG_LEARNING_OUTLINE.html"

  - title: "🟢 第一阶段：最小 RAG"
    items:
      - title: "第 1 课 · 关键词伪 RAG"
        url: "/docs/lessons/lesson-01-keyword-rag.html"
      - title: "└ 第 1 课 · 运行日志"
        url: "/docs/lessons/lesson-01-run-log.html"
      - title: "第 2 课 · Embedding 向量检索"
        url: "/docs/lessons/lesson-02-embedding-rag.html"
      - title: "└ 第 2 课 · 运行日志"
